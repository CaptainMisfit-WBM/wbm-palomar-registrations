name = "ProcessOntologyLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ProcessOntologyLean", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "ProcessOntologyLean"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
